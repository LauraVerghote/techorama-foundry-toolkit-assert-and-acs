# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: ">=1.27.1"
extensions:
  azure.ai.agents: ">=1.0.0-beta.9"
name: assert-bank-manager-demo
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.6-terra
        model:
          format: OpenAI
          name: gpt-5.6-terra
          version: "2026-07-09"
        sku:
          name: GlobalStandard
          capacity: 500
  bank-manager-agent:
    host: azure.ai.agent
    project: .
    language: python
    uses:
      - ai-project
    kind: hosted
    name: bank-manager-agent
    displayName: ASSERT Bank Manager
    description: Locally evaluated Bank Manager agent with ACS policy enforcement.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_API_VERSION: 2025-03-01-preview
      KB_BACKEND: mock
    codeConfiguration:
      runtime: python_3_13
      entryPoint: hosted_agent_main.py
      dependencyResolution: remote_build
infra:
  provider: microsoft.foundry
hooks:
  postprovision:
    shell: pwsh
    run: ./scripts/configure_foundry_content_filter.ps1
